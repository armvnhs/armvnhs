<a class="wrow" href="{{ include.p.url }}">
<span class="wr-thumb">{%- if include.p.cover.size > 0 -%}<img src="{{ include.p.cover | uri_escape }}" alt="" loading="lazy" decoding="async">{%- else -%}<b>{{ include.p.title | slice: 0 }}</b>{%- endif -%}</span>
<span class="wr-title" dir="auto">{% include bi.html en=include.p.title fa=include.p.title_fa %}</span>
<span class="wr-dots" aria-hidden="true"></span>
<time datetime="{{ include.p.date | date_to_xmlschema }}" data-raw>{{ include.p.date | date: "%y/%m/%d" }}</time>
</a>
